name: Build and Release LESH

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - id: ver
        run: echo "tag=$(date -u +%y.%m.%d.%H.%M)" >> "$GITHUB_OUTPUT"

      - run: echo "Tag = ${{ steps.ver.outputs.tag }}"

      - run: mvn -B -q -DskipTests package

      - run: |
          mkdir -p dist
          cp target/LESH-*.jar "dist/LESH-${{ steps.ver.outputs.tag }}.jar"
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: LESH ${{ steps.ver.outputs.tag }}
          body: Release ${{ steps.ver.outputs.tag }} from ${{ github.sha }}
          files: dist/LESH-${{ steps.ver.outputs.tag }}.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
