name: Build and Release LESH

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - id: ver
        shell: bash
        run: echo "tag=$(date -u +%y.%m.%d.%H.%M)" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build platform JAR
        run: mvn -B -DskipTests clean package

      - name: Rename artifact
        shell: bash
        run: cp target/LESH-1.1.0.jar "LESH-${{ matrix.name }}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: lesh-${{ matrix.name }}
          path: LESH-${{ matrix.name }}.jar
          if-no-files-found: error

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lesh-*
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: LESH ${{ needs.meta.outputs.tag }}
          body: Platform builds of LESH from ${{ github.sha }}
          files: dist/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
