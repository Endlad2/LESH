name: Build and Release LESH

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - id: ver
        shell: bash
        run: echo "tag=$(date -u +%y.%m.%d.%H.%M)" >> "$GITHUB_OUTPUT"

      - name: Build cross-platform fat JAR
        run: mvn -B -DskipTests clean package

      - name: Prepare release artifact
        shell: bash
        run: |
          test -f target/LESH-1.0.1.jar
          mkdir -p dist
          cp target/LESH-1.0.1.jar "dist/LESH-${{ steps.ver.outputs.tag }}.jar"
          ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: LESH ${{ steps.ver.outputs.tag }}
          body: Release ${{ steps.ver.outputs.tag }} from ${{ github.sha }}
          files: dist/LESH-${{ steps.ver.outputs.tag }}.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
